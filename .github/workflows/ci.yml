name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A full clone keeps `uv sync` and any VCS-derived version correct
          # regardless of the packaging mode the project chose.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Lockfile is current
        run: uv run poe lock:check

      - name: Format
        run: uv run poe format:check

      - name: Lint
        run: uv run poe lint

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Type check (ty)
        run: uv run poe typecheck

  typecheck-mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Type check (mypy)
        run: uv run poe typecheck:mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync

      - name: Test
        run: uv run poe test

      - name: Coverage
        run: uv run poe coverage --cov-report=xml

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  migrations:
    name: Migrations (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: pcr
          POSTGRES_PASSWORD: pcr
          POSTGRES_DB: pcr
        options: >-
          --health-cmd "pg_isready -U pcr -d pcr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Upgrade to head
        env:
          PCR_DATABASE_URL: ${{ matrix.backend == 'sqlite' && 'sqlite:///migrations-check.sqlite3' || 'postgresql+psycopg://pcr:pcr@localhost:5432/pcr' }}
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        env:
          PCR_DATABASE_URL: ${{ matrix.backend == 'sqlite' && 'sqlite:///migrations-check.sqlite3' || 'postgresql+psycopg://pcr:pcr@localhost:5432/pcr' }}
        run: uv run alembic check

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify metadata
        run: |
          uv tool run twine check dist/*
          ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  type-check-pyright:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Pyright
        run: uv run poe typecheck:pyright
